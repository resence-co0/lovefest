<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Private Love Feast Secret Santa registration and assignment exchange" />
  <title>Love Feast · Secret Santa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="grain"></div>
  <main id="app">
    <div class="app-loading" role="status">
      <span class="brand-mark loading-mark" aria-hidden="true">✦</span>
      <p>Opening the Love Feast…</p>
      <p class="tiny loading-slow">Still connecting. This can take a moment on mobile data.</p>
    </div>
    <noscript><p class="app-loading">Please turn on JavaScript to use Love Feast.</p></noscript>
  </main>
  <div id="toast" class="toast-region" aria-live="polite"></div>
  <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <div class="confirm-body">
      <h3 id="confirm-title"></h3>
      <p id="confirm-message"></p>
      <div class="confirm-actions">
        <button type="button" id="confirm-cancel" class="button secondary">Cancel</button>
        <button type="button" id="confirm-ok" class="button">Confirm</button>
      </div>
    </div>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
